[project]
name = "project-rag-eval"
version = "0.1.0"
description = "A layered evaluation suite for LLM / RAG applications: component, end-to-end, quality and safety evals with LLM-as-a-judge."
readme = "README.md"
authors = [
    { name = "Avinash Mahadev Yerolkar", email = "avinashmyerolkar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.8",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.11",
    "openai>=3.24.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]


[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
